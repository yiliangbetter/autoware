services:
  planning-simulator:
    image: ghcr.io/autowarefoundation/autoware:universe-jazzy
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///home/aw/cyclonedds.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/autoware_data/maps:/home/aw/autoware_data/maps
      - ${HOME}/autoware_data/ml_models:/home/aw/autoware_data/ml_models
      - ${AUTOWARE_REPO_ROOT:-../../../../}/docker/files/cyclonedds-docker.xml:/home/aw/cyclonedds.xml:ro
    command:
      - bash
      - -c
      - |
        ros2 launch autoware_launch planning_simulator.launch.xml \
          map_path:=/home/aw/autoware_data/maps/sample-map-planning \
          vehicle_model:=sample_vehicle \
          sensor_model:=sample_sensor_kit
        exec bash
